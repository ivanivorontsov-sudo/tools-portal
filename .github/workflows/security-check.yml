name: Security syntax checks

on:
  push:
    branches: [main]
    paths:
      - "assets/site-support.css"
      - "assets/site-support.js"
      - "privacy.html"
      - "index.html"
      - "assets/js/**"
      - "assets/css/**"
      - "tailwind.config.cjs"
      - "pdf-master/**"
      - "desktop-bundles/linux/**"
      - "desktop-bundles/windows/**"
      - "scripts/**"
      - "categories/**"
      - ".github/workflows/security-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/site-support.css"
      - "assets/site-support.js"
      - "privacy.html"
      - "index.html"
      - "assets/js/**"
      - "assets/css/**"
      - "tailwind.config.cjs"
      - "pdf-master/**"
      - "desktop-bundles/linux/**"
      - "desktop-bundles/windows/**"
      - ".github/workflows/security-check.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check browser JavaScript
        run: |
          node --check assets/js/app.js
          node --check assets/js/tools-data.js
          node --check assets/js/regex-worker.js
          node --check pdf-master/app.mjs
      - name: Check Linux installer syntax
        run: bash -n desktop-bundles/linux/install-ivan-tools.sh
      - name: Install Playwright and build production CSS
        run: |
          npm install --no-save playwright tailwindcss@3.4.19
          npx tailwindcss -c tailwind.config.cjs -i assets/css/tailwind.input.css -o /tmp/tailwind.min.css --minify
          npx playwright install --with-deps chromium
      - name: Upload generated CSS for verification
        uses: actions/upload-artifact@v4
        with:
          name: generated-tailwind-css
          path: /tmp/tailwind.min.css
          if-no-files-found: error
          retention-days: 1
      - name: Verify tracked production CSS
        run: |
          cmp --silent assets/css/tailwind.min.css /tmp/tailwind.min.css || {
            echo "Production CSS is out of date. Rebuild it using the command in README.md and commit assets/css/tailwind.min.css."
            exit 1
          }
      - name: Browser smoke tests for active tools
        run: |
          set -Eeuo pipefail
          python -m http.server 8766 --bind 127.0.0.1 >/tmp/portal-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8766/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8766/ >/dev/null
          node scripts/browser-smoke.mjs


  windows-installer-syntax:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Parse Windows installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/desktop-bundles/windows/Install-IvanTools.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
